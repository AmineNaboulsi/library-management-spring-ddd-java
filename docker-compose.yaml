services:
  postgres_library:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5437:5432"
    volumes:
      - postgres_data_library:/var/lib/postgresql/data
volumes:
  postgres_data_library: